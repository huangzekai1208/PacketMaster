[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetmaster"
version = "0.1.0"
description = "TCP speed diagnosis agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=2,<3",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "psutil>=5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "scapy>=2",
    "typer>=0.12",
    "uvicorn>=0.30,<1",
]

[project.scripts]
packetmaster = "packetmaster.cli:app"
pkm = "packetmaster.cli:app"

[project.optional-dependencies]
rag = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "performance: optional large-capture release gates",
]
filterwarnings = [
    "ignore:authlib\\.jose module is deprecated.*:authlib.deprecate.AuthlibDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packetmaster = ["prompts/*.md", "web/static/**/*"]

[tool.setuptools.data-files]
"share/packetmaster/speed-analyze/scripts" = [
    "speed-analyze/scripts/run_pipeline.py",
    "speed-analyze/scripts/speed_filter_strip.py",
    "speed-analyze/scripts/tcp_extract.py",
]
"share/packetmaster/speed-analyze/scripts/lib" = [
    "speed-analyze/scripts/lib/__init__.py",
    "speed-analyze/scripts/lib/aggregate.py",
    "speed-analyze/scripts/lib/progress.py",
    "speed-analyze/scripts/lib/store.py",
    "speed-analyze/scripts/lib/tshark.py",
]

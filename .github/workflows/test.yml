name: PacketMaster cross-platform gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gate: Windows release gate
            tshark_path: 'C:\Program Files\Wireshark\tshark.exe'
          - os: macos-latest
            gate: macOS compatibility gate
            tshark_path: tshark
    runs-on: ${{ matrix.os }}
    env:
      PACKETMASTER_REQUIRE_TSHARK: "1"
      TSHARK_PATH: ${{ matrix.tshark_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install TShark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wireshark --no-progress -y
      - name: Install TShark on macOS
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Verify TShark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:TSHARK_PATH" --version'
      - name: Verify TShark on macOS
        if: runner.os == 'macOS'
        run: '"$TSHARK_PATH" --version'
      - name: Install PacketMaster
        run: python -m pip install -e ".[dev]"
      - name: Run non-performance tests
        run: python -m pytest -m "not performance" -v
      - name: Run Ruff
        run: python -m ruff check src speed-analyze/scripts tests scripts

  windows-large-capture:
    name: Windows optional 2GB performance gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, packetmaster-performance]
    env:
      PACKETMASTER_REQUIRE_TSHARK: "1"
      TSHARK_PATH: 'C:\Program Files\Wireshark\tshark.exe'
      PERF_PCAP_PATH: ${{ vars.PERF_PCAP_PATH }}
      PERF_METADATA_PATH: ${{ vars.PERF_METADATA_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify TShark
        shell: pwsh
        run: '& "$env:TSHARK_PATH" --version'
      - name: Require the local large-capture fixture
        if: env.PERF_PCAP_PATH == '' || env.PERF_METADATA_PATH == ''
        shell: pwsh
        run: >-
          throw 'Set PERF_PCAP_PATH and PERF_METADATA_PATH repository variables.'
      - name: Run large-capture release gate
        run: python -m pytest tests/performance/test_large_capture.py -v
